[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-application-assistant"
version = "0.1.0.dev32"
description = "Evidence-preserving BC academic record processing for an Agent Plugin"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pdfplumber==0.11.10"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "jsonschema>=4.26,<5", "PyYAML>=6,<7", "build>=1.4,<2", "reportlab>=5,<6", "setuptools>=75", "wheel>=0.45"]

[project.scripts]
bc-application = "bc_application.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/bc-application/scripts"}

[tool.setuptools.packages.find]
where = ["skills/bc-application/scripts"]
include = ["bc_application*"]

[tool.setuptools.package-data]
bc_application = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/bc-application/scripts", "."]
addopts = "-ra"
