name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - shell: pwsh
        run: ./tools/check.ps1 -Python (Get-Command python).Source -BuildRelease
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-preview
          if-no-files-found: error
          path: |
            outputs/*.zip
            outputs/*.validation.json
            outputs/release-verification.json
